[package]
name = "qcore"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Q-Music core: format-agnostic decode, playback engine, library index, tags and lyrics."

[dependencies]
symphonia = { version = "0.6", features = ["all"] }
cpal = "0.18"
lofty = "0.25"
rusqlite = { version = "0.41", features = ["bundled"] }
crossbeam-queue = "0.3"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "7"

[dev-dependencies]
tempfile = "3"
